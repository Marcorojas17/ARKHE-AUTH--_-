<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARKHE SENTINEL - Command Center</title>
    <style>
        body { background-color: #0a0a0a; color: #00ffcc; font-family: 'Courier New', monospace; padding: 20px; }
        .panel { border: 1px solid #00ffcc; padding: 15px; margin-bottom: 20px; border-radius: 5px; background: #111; box-shadow: 0 0 10px rgba(0,255,204,0.1); }
        h1, h2 { color: #ff0055; text-shadow: 0 0 5px #ff0055; }
        button { background: #00ffcc; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; margin: 5px; }
        button:hover { background: #00ccaa; }
        .log-item { border-bottom: 1px solid #333; padding: 10px 0; font-size: 0.9em; }
        .blocked { color: #ff0055; font-weight: bold; }
        .allowed { color: #00ffcc; }
        .dossier { background: #1a0000; border: 1px solid #ff0055; padding: 10px; margin-top: 5px; font-size: 0.85em; color: #ff9999; }
        .chain { background: #002200; border: 1px solid #00ff00; padding: 10px; margin-top: 5px; font-size: 0.85em; color: #fff; }
        #system-status { font-size: 1.2em; font-weight: bold; margin-bottom: 10px;}
    </style>
</head>
<body>
    <h1>🚄 ARKHE SENTINEL: CIBERINTELIGENCIA</h1>
    
    <div class="panel">
        <h2>Estado del Sistema</h2>
        <div id="system-status">Cargando estado...</div>
        <button onclick="toggleKillswitch()">Alternar Defensa Activa</button>
    </div>

    <div class="panel">
        <h2>Registro de Capturas y Trazabilidad</h2>
        <div id="logs-container">Esperando acciones...</div>
    </div>

    <script>
        const API_URL = window.location.origin;

        async function fetchLogs() {
            try {
                const res = await fetch(`${API_URL}/v1/guard/logs`);
                const data = await res.json();
                
                const statusDiv = document.getElementById('system-status');
                statusDiv.innerHTML = data.status.active_defense 
                    ? "🟢 DEFENSA ACTIVA: Rastreando anomalías" 
                    : "🔴 DEFENSA DESACTIVADA";
                statusDiv.style.color = data.status.active_defense ? "#00ffcc" : "#ff0055";

                const logsDiv = document.getElementById('logs-container');
                if(data.logs.length === 0) {
                    logsDiv.innerHTML = "No hay acciones registradas.";
                } else {
                    logsDiv.innerHTML = data.logs.map(log => `
                        <div class="log-item">
                            <span class="${log.status.toLowerCase()}">[${log.status}]</span> 
                            <strong>${log.agent_id}</strong> intentó <em>${log.accion}</em> - ${log.reason}
                            <br><small>Timestamp: ${log.timestamp}</small>
                            ${log.status === 'BLOCKED' ? `
                            <div class="dossier">
                                <strong>🚨 DOSSIER DEL AGENTE CAPTURADO:</strong><br>
                                <b>IP Real:</b> ${log.ip_real} <br>
                                <b>Creador (Token):</b> ${log.creador_token} <br>
                                <b>Contexto (Prompt):</b> ${log.contexto_real} <br>
                                <b>Payload:</b> ${log.payload}
                            </div>d : ''}
                            <div class="chain">
                                <strong>🔗 THAZABILIDAD CRIPTOGRÉFICA:</strong><br>
                                <b>Hash Anterior:</b> ${log.hash_anterior} <br>
                                <b>Hash Actual:</b> ${log.hash_actual}
                            </div>
                        </div>
                    `).join('');
                }
            } catch (e) { console.error("Error conectando a la API"); }
        }

        async function toggleKillswitch() {
            await fetch(`${API_URL}/v1/guard/toggle-killswitch`, { method: 'POST' });
            fetchLogs();
        }

        setInterval(fetchLogs, 3000);
        fetchLogs();
    </script>
</body>
</html>
