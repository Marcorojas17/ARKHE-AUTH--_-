name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --if-present
      - name: Block deploy of unaudited contracts
        run: |
          if grep -rl "KronosDAO\|SovereignCity" contracts/ 2>/dev/null; then
            echo "DAO no auditado. Deploy bloqueado." && exit 1
          fi
