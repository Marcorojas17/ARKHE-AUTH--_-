name: Construir Binarios (Windows, Mac, Linux)

on:
  release:
    types: [published]

jobs:
  build:
    name: Construir en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: arkhe-auth-linux
            asset_name: arkhe-auth-linux
          - os: windows-latest
            artifact_name: arkhe-auth-windows.exe
            asset_name: arkhe-auth-windows.exe
          - os: macos-latest
            artifact_name: arkhe-auth-macos
            asset_name: arkhe-auth-macos

    steps:
    - uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Compilar con PyInstaller (Linux/Mac)
      if: matrix.os != 'windows-latest'
      run: |
        pyinstaller --onefile --collect-all dilithium_py --collect-all mcp --add-data "web:web" launcher.py
        mv dist/launcher dist/${{ matrix.artifact_name }}
        
    - name: Compilar con PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --onefile --collect-all dilithium_py --collect-all mcp --add-data "web;web" launcher.py
        move dist\launcher.exe dist\${{ matrix.artifact_name }}
        
    - name: Subir a GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        files: dist/${{ matrix.artifact_name }}
